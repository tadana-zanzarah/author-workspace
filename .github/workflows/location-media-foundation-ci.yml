name: Location Media Foundation CI

# Verifies the B4A backend/storage foundation (supabase/migrations/20260907090000_location_media_
# foundation.sql): the location_media table, the private location-media Storage bucket, RLS on both,
# the list/create/update/delete_location_media RPC surface, and get_project_content's additive
# primary_photo projection. Mirrors the established disposable-CI pattern exactly (single job, fresh
# `supabase start` on the runner, full migration chain + full supabase/tests/*.sql regression suite,
# plus `npm test`).
#
# SAFETY / SCOPE (read before editing):
#   - Every database here is a disposable local Supabase/Postgres stack, created by
#     `supabase start` on the GitHub-hosted runner and destroyed with the runner. Nothing in this
#     workflow ever runs `supabase link`, so there is no remote project configured at any point --
#     `supabase migration up` and friends structurally cannot reach a remote database even by
#     mistake.
#   - This workflow does NOT read SUPABASE_ACCESS_TOKEN or any other secret. It does NOT run
#     `supabase db push`, does NOT call the Supabase Management API, and has no deploy step.
#   - It only ever runs on this feature branch (push) or on demand (workflow_dispatch), so a PR is
#     never required to exercise it. It must not be pointed at `master`/production without a
#     deliberate, separate decision.
#
# WHAT THIS VALIDATES: fresh-db-and-regression applies the full migration chain from zero and runs
# every supabase/tests/*.sql file (schema/introspection, RLS, and the full existing regression
# suite, including the new location_media_foundation.sql contract -- table shape, constraints,
# indexes, bucket config, RLS, path validation, primary/fallback semantics per (scope,media_kind),
# canonical vs project revision domains, soft delete + storage_cleanup_required, cross-user
# isolation) against real Postgres.

on:
  push:
    branches:
      - 'feature/location-media-b4a-backend-foundation'
  workflow_dispatch: {}

jobs:
  fresh-db-and-regression:
    runs-on: ubuntu-latest
    env:
      LOCAL_PG_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: JS unit tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure psql is available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Start disposable local Supabase (applies the full migration chain from zero)
        run: supabase start

      - name: Run every SQL test in supabase/tests (schema, RLS, full regression suite)
        run: |
          set -e
          for f in supabase/tests/*.sql; do
            echo "::group::psql -f $f"
            if ! psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -f "$f" 2> /tmp/psql-error.log; then
              escaped=$(sed 's/%/%25/g; s/\r/%0D/g' /tmp/psql-error.log | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=${f} failed::${escaped}"
              cat /tmp/psql-error.log
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
