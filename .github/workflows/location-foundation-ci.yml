name: Location Foundation Schema CI

# Location Architecture V2 Phase 1 verification.
#
# SAFETY / SCOPE (read before editing):
#   - Every database here is a disposable local Supabase/Postgres stack, created by
#     `supabase start` on the GitHub-hosted runner and destroyed with the runner. Nothing in
#     this workflow ever runs `supabase link`, so there is no remote project configured at
#     any point -- `supabase migration up` and friends structurally cannot reach a remote
#     database even by mistake.
#   - This workflow does NOT read SUPABASE_ACCESS_TOKEN or any other secret. It does NOT run
#     `supabase db push`, does NOT call the Supabase Management API, and has no deploy step.
#   - It only ever runs on this feature branch (push) or on demand (workflow_dispatch), so a
#     PR is never required to exercise it. It must not be pointed at `master`/production
#     without a deliberate, separate decision.
#
# WHAT THIS VALIDATES (Location Foundation Schema, migration
# supabase/migrations/20260902120000_location_foundation_schema.sql):
#   1. fresh-db-and-regression: applies the full migration chain from zero and runs every
#      supabase/tests/*.sql file (schema/introspection, RLS, and the existing regression
#      suite) against real Postgres.
#   2. true-upgrade-path: applies the migration chain EXCLUDING the Location Foundation
#      migration, seeds a legacy Location + Scene through the unmodified production RPC,
#      applies ONLY that one migration on top, and verifies the pre-migration data and the
#      existing RPC surface survived unchanged.

on:
  push:
    branches:
      - 'feature/location-foundation-schema'
  workflow_dispatch: {}

jobs:
  fresh-db-and-regression:
    runs-on: ubuntu-latest
    env:
      LOCAL_PG_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: JS unit tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure psql is available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Start disposable local Supabase (applies the full migration chain from zero)
        run: supabase start

      - name: Run every SQL test in supabase/tests (schema, RLS, existing regression)
        run: |
          set -e
          for f in supabase/tests/*.sql; do
            echo "::group::psql -f $f"
            psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup

  true-upgrade-path:
    runs-on: ubuntu-latest
    env:
      LOCAL_PG_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      LOCATION_MIGRATION: supabase/migrations/20260902120000_location_foundation_schema.sql
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure psql is available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Move the Location Foundation migration out of the chain (pre-Phase-1 state)
        run: mv "$LOCATION_MIGRATION" /tmp/location_foundation_schema.sql.pending

      - name: Start disposable local Supabase on the pre-Phase-1 migration chain
        run: supabase start

      - name: Seed a legacy Location + Scene via the current production RPC
        run: psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -f supabase/tests/ci/location_upgrade_00_pre_seed.sql

      - name: Restore the Location Foundation migration and apply ONLY it
        run: |
          mv /tmp/location_foundation_schema.sql.pending "$LOCATION_MIGRATION"
          supabase migration up

      - name: True pre -> post upgrade-path verification
        run: psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -f supabase/tests/ci/location_upgrade_01_post_verify.sql

      - name: Two-user security, re-run against the post-migration schema
        run: psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -f supabase/tests/location_foundation_rls.sql

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
