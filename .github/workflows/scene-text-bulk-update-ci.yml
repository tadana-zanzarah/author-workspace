name: Scene Text Bulk Update CI

# Verifies 20260910120000_scene_text_bulk_update.sql: the bulk_update_scene_text
# RPC that atomically writes scene_text + metadata for many scenes in one call
# (the Find/Replace project-wide "Весь проект" atomic persistence foundation --
# Stage A only, no Find/Replace matching logic exists yet). Mirrors the
# established disposable-CI pattern exactly (single job, fresh `supabase start`
# on the runner, full migration chain + full supabase/tests/*.sql regression
# suite, plus `npm test`) -- see scene-rich-text-ci.yml for the precedent this
# follows; no new CI architecture introduced. This migration adds one function
# only (no new table/column, no destructive change to existing rows), so it
# does not need a separate true-upgrade-path job.
#
# SAFETY / SCOPE (read before editing):
#   - Every database here is a disposable local Supabase/Postgres stack, created by
#     `supabase start` on the GitHub-hosted runner and destroyed with the runner. Nothing in this
#     workflow ever runs `supabase link`, so there is no remote project configured at any point --
#     `supabase migration up` and friends structurally cannot reach a remote database even by
#     mistake.
#   - This workflow does NOT read SUPABASE_ACCESS_TOKEN or any other secret. It does NOT run
#     `supabase db push`, does NOT call the Supabase Management API, and has no deploy step.
#   - It only ever runs on this feature branch (push) or on demand (workflow_dispatch), so a PR is
#     never required to exercise it. It must not be pointed at `master`/production without a
#     deliberate, separate decision.
#
# WHAT THIS VALIDATES: fresh-db-and-regression applies the full migration chain from zero
# (including 20260910120000_scene_text_bulk_update.sql) and runs every supabase/tests/*.sql file --
# schema/introspection, RLS, the full existing regression suite, and the new
# cloud_scene_text_bulk_update_rpc.sql contract (successful multi-scene write with exactly one
# revision bump, semantic no-op detection, stale revision, wrong-project/nonexistent/deleted scene,
# duplicate scene_id, an invalid LATE array element leaving even earlier valid elements unwritten,
# cross-user isolation, anon denial) -- against real Postgres.

on:
  push:
    branches:
      - 'feature/find-replace-atomic-foundation'
  workflow_dispatch: {}

jobs:
  fresh-db-and-regression:
    runs-on: ubuntu-latest
    env:
      LOCAL_PG_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm ci

      - name: JS unit tests
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ensure psql is available
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Start disposable local Supabase (applies the full migration chain from zero)
        run: supabase start

      - name: Run every SQL test in supabase/tests (schema, RLS, full regression suite)
        run: |
          set -e
          for f in supabase/tests/*.sql; do
            echo "::group::psql -f $f"
            if ! psql "$LOCAL_PG_URL" -v ON_ERROR_STOP=1 -f "$f" 2> /tmp/psql-error.log; then
              escaped=$(sed 's/%/%25/g; s/\r/%0D/g' /tmp/psql-error.log | awk 'BEGIN{ORS="%0A"}{print}')
              echo "::error title=${f} failed::${escaped}"
              cat /tmp/psql-error.log
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
